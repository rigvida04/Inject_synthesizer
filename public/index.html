<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inject Synthesizer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f0f1a;
      color: #e0e0ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    h1 {
      font-size: 2.5rem;
      color: #a78bfa;
      margin-bottom: 0.5rem;
      text-align: center;
    }
    p.subtitle {
      color: #8888aa;
      margin-bottom: 2.5rem;
      text-align: center;
    }
    .card {
      background: #1a1a2e;
      border: 1px solid #2d2d4a;
      border-radius: 1rem;
      padding: 2rem 2.5rem;
      max-width: 560px;
      width: 100%;
      text-align: center;
    }
    .status {
      display: inline-block;
      background: #22c55e22;
      color: #22c55e;
      border: 1px solid #22c55e55;
      border-radius: 999px;
      padding: 0.25rem 1rem;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
    }
    .url-box {
      background: #0f0f1a;
      border: 1px solid #3d3d5e;
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      font-family: monospace;
      font-size: 0.95rem;
      color: #a78bfa;
      word-break: break-all;
      margin-bottom: 1.5rem;
    }
    .btn {
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      padding: 0.65rem 1.75rem;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
      text-decoration: none;
      display: inline-block;
    }
    .btn:hover { background: #6d28d9; }
    .info {
      margin-top: 1.5rem;
      font-size: 0.82rem;
      color: #6666aa;
    }
  </style>
</head>
<body>
  <h1>🎛️ Inject Synthesizer</h1>
  <p class="subtitle">Your synthesizer app, accessible from anywhere</p>

  <div class="card">
    <span class="status">● Server running</span>
    <p style="margin-bottom:1rem;">This server is live and reachable via the public URL below:</p>
    <div class="url-box" id="publicUrl">Loading…</div>
    <a class="btn" id="openBtn" href="#" target="_blank" rel="noopener noreferrer">Open App</a>
    <p class="info">
      Run <code>npm run tunnel</code> to generate a shareable public URL<br>
      that works on any device — no firewall configuration needed.
    </p>
  </div>

  <script>
    // Use new URL('.', href) so the base path is correct both at '/' and under
    // a subpath (e.g. GitHub Pages at /Inject_synthesizer/)
    const appBase = new URL('.', window.location.href).href.replace(/\/$/, '');
    const host = window.location.hostname;
    const urlEl = document.getElementById('publicUrl');
    const btnEl = document.getElementById('openBtn');

    if (host === 'localhost' || host === '127.0.0.1') {
      urlEl.textContent = 'Run `npm run tunnel` to get your public URL';
      btnEl.textContent = 'Open Locally';
      btnEl.href = appBase;
    } else {
      urlEl.textContent = appBase;
      btnEl.href = appBase;
    }
  </script>
</body>
</html>
